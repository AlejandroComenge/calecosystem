name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobacion de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: La demo debe seguir ejecutandose
        run: npm run demo
